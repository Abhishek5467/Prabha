name: Validate prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/studio/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python core-py/tests/run_conformance.py
      - run: python -m pytest tests -q
      - run: g++ -std=c++17 -O2 -Icore-cpp/include -Icore-cpp/third_party core-cpp/src/main_conformance.cpp -o prabha-conformance
      - run: ./prabha-conformance .
      - run: npm ci --prefix frontend/studio
      - run: python scripts/build_web_assets.py
      - run: npm run build --prefix frontend/studio
