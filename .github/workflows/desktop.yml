name: Desktop packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/build_sidecar.py'
      - 'scripts/desktop_entry.py'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: npm ci --prefix frontend/studio
      - run: python scripts/build_web_assets.py
      - run: npm run build --prefix frontend/studio
      - run: npm ci --prefix desktop
      - run: python scripts/build_sidecar.py
      - run: npm run build --prefix desktop
        env:
          NO_STRIP: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: prabha-${{ matrix.os }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
