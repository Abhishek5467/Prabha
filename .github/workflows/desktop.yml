name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Build ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            architecture: x64
            bundles: deb,appimage
          - platform: windows-x64
            os: windows-2022
            architecture: x64
            bundles: nsis
          - platform: macos-intel
            os: macos-15-intel
            architecture: x64
            bundles: dmg
          - platform: macos-apple-silicon
            os: macos-15
            architecture: arm64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/studio/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: npm ci --prefix frontend/studio
      - run: npm test --prefix frontend/studio
      - run: python scripts/build_web_assets.py
      - run: npm run build --prefix frontend/studio
      - run: npm ci --prefix desktop
      - name: Build and smoke-test native Python engine
        run: python scripts/build_sidecar.py
      - name: Build installers
        run: npm run build --prefix desktop -- --bundles ${{ matrix.bundles }}
        env:
          NO_STRIP: 'true'
      - name: Collect installers and SHA-256 manifest
        run: python scripts/package_desktop_artifacts.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: prabha-preview-${{ matrix.platform }}
          path: build/desktop-artifacts/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
